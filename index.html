<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating stars -->

    <span>✦</span><span>✧</span><span>✦</span><span>♡</span><span>✧</span><span>✦</span>
    <span>✦</span><span>✧</span><span>♡</span><span>✦</span><span>✧</span><span>♡</span>
    <span>✦</span><span>✧</span><span>♡</span>
</div>


    <!-- MAIN CONTENT -->
    <main class="home">

        <p class="small-text">A little something I made for you</p>

        <h1>
            Happy Birthday,
            <br>
            <span>MY BABY AMIRA !!</span> ❤️
        </h1>

        <p class="subtitle">
            I wanted to give you something that
            <br>
            I made with my own hands.
        </p>


        <!-- PHOTO -->
        <div class="photo-frame">
            <img src="images/baby.jpeg" alt="A special memory">
        </div>


        <!-- DAYS TOGETHER -->
        <p class="days">
            ♥ <span id="daysTogether">0</span> days of memories
        </p>


        <!-- ENTER BUTTON -->
        <button onclick="enterWebsite()">
            Enter Our Story
            <span>→</span>
        </button>

    </main>


    <!-- FOOTER -->
    <footer>
        Made with HTML, CSS & JavaScript
    </footer>


    <!-- Your JavaScript -->
    <script src="script.js"></script>

</html>
