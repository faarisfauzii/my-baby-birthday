    <section class="page">
        <div class="eyebrow">Open When</div>
        <h1 class="page-title">Open When... 💌</h1>
        <p class="page-subtitle">Letters for every moment you need.</p>

        <div class="envelope-grid">
            <div class="envelope env-1" onclick="openLetter('miss')">You miss me<span class="heart">♥</span></div>
            <div class="envelope env-2" onclick="openLetter('badday')">You're having a bad day<span class="heart">♥</span></div>
            <div class="envelope env-3" onclick="openLetter('sleep')">You can't sleep<span class="heart">♥</span></div>
            <div class="envelope env-4" onclick="openLetter('mad')">You're mad at me<span class="heart">♥</span></div>
            <div class="envelope env-5" onclick="openLetter('reassurance')">You need reassurance<span class="heart">♥</span></div>
            <div class="envelope env-7" onclick="openLetter('smile')">You want to smile<span class="heart">♥</span></div>
        </div>
    </section>

    <div class="modal-overlay" id="letterModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeLetter()">✕</button>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-text" id="modalText"></div>
        </div>
